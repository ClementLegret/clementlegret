<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Révisions UE 2.7 — Défaillances organiques & processus dégénératifs</title>
<style>
  :root{
    --bg:#060b16; --bg2:#0a1224; --glass:rgba(17,28,51,.55); --glass-2:rgba(13,22,42,.75);
    --line:rgba(120,170,255,.14); --line-2:rgba(120,170,255,.28);
    --ink:#eaf2ff; --muted:#8aa0c6; --faint:#5d719b;
    --cyan:#22d3ee; --teal:#2dd4bf; --blue:#5b8cff; --violet:#a78bfa;
    --ok:#34d399; --ok-bg:rgba(52,211,153,.12); --bad:#fb7185; --bad-bg:rgba(251,113,133,.12);
    --warn:#fbbf24; --warn-bg:rgba(251,191,36,.12);
    --radius:20px; --shadow:0 18px 50px rgba(0,0,0,.45);
    --glow:0 0 0 1px rgba(34,211,238,.35), 0 12px 40px rgba(34,211,238,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased; line-height:1.55;
    background:
      radial-gradient(1200px 700px at 12% -8%, rgba(34,211,238,.16), transparent 60%),
      radial-gradient(1000px 600px at 95% 8%, rgba(167,139,250,.14), transparent 55%),
      radial-gradient(900px 700px at 50% 120%, rgba(45,212,191,.12), transparent 60%),
      linear-gradient(180deg,#060b16 0%,#070d1c 100%);
    background-attachment:fixed;
  }
  /* subtle grid overlay */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.4;
    background-image:linear-gradient(rgba(120,170,255,.04) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(120,170,255,.04) 1px,transparent 1px);
    background-size:48px 48px;mask-image:radial-gradient(circle at 50% 30%,#000 30%,transparent 80%);
  }
  .app{position:relative;z-index:1;width:100%;max-width:1040px;margin:0 auto;padding:18px 16px 40px;}

  /* ---------- Header ---------- */
  header.bar{position:sticky;top:0;z-index:50;background:rgba(6,11,22,.72);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);}
  .bar-in{width:100%;max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px;}
  .brand{font-weight:800;font-size:1rem;letter-spacing:.2px;display:flex;align-items:center;gap:11px;flex:1;min-width:0}
  .brand .logo{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--cyan),var(--blue));box-shadow:0 0 18px rgba(34,211,238,.5);
    font-size:1.05rem;color:#04121a;font-weight:900;position:relative}
  .brand .logo::after{content:"";position:absolute;inset:0;border-radius:10px;border:1px solid rgba(255,255,255,.35)}
  .brand small{display:block;font-weight:500;color:var(--faint);font-size:.7rem;letter-spacing:.4px;text-transform:uppercase}
  .timer{display:none;align-items:center;gap:7px;background:var(--glass-2);border:1px solid var(--line-2);
    border-radius:999px;padding:8px 14px;font-weight:800;color:var(--bad);font-variant-numeric:tabular-nums;
    box-shadow:0 0 18px rgba(251,113,133,.25)}
  .timer.calm{color:var(--cyan);box-shadow:0 0 18px rgba(34,211,238,.2)}
  .btn-home{display:none;align-items:center;gap:7px;background:transparent;color:var(--ink);
    border:1px solid var(--line-2);border-radius:999px;padding:9px 15px;font-weight:700;font-size:.82rem;
    cursor:pointer;white-space:nowrap;transition:.15s}
  .btn-home:hover{border-color:var(--cyan);box-shadow:0 0 16px rgba(34,211,238,.25);color:var(--cyan)}
  .btn-home:active{transform:scale(.97)}

  /* ---------- Cards ---------- */
  .card{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:18px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(34,211,238,.6),transparent)}
  h1{font-size:1.7rem;line-height:1.15;margin-bottom:8px;letter-spacing:.2px;font-weight:700}
  h2{font-size:1.2rem;margin-bottom:6px;font-weight:700;letter-spacing:.2px}
  /* Titres : police moderne + couleur claire explicite (lisible sur fond sombre) */
  h1,h2,.tile .t,.quiz-tile .t,.mode-card h3,.verdict,.dossier-head h1,.brand{
    font-family:"Bahnschrift","Segoe UI Variable Display","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;
    color:#eef4ff;text-shadow:0 0 22px rgba(120,170,255,.28);
  }
  .lead{color:var(--muted);font-size:.95rem}
  .pill{display:inline-flex;align-items:center;gap:6px;background:rgba(34,211,238,.1);color:var(--cyan);
    border:1px solid rgba(34,211,238,.3);border-radius:999px;padding:5px 13px;font-size:.7rem;font-weight:800;
    letter-spacing:.6px;text-transform:uppercase;margin-bottom:14px}

  /* ---------- Hero ---------- */
  .hero{text-align:left}
  .hero .sub{color:var(--muted);max-width:640px;margin-top:6px}
  .stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .stat{background:var(--glass-2);border:1px solid var(--line);border-radius:14px;padding:10px 16px;min-width:96px}
  .stat .n{font-size:1.4rem;font-weight:900;color:var(--cyan);line-height:1;font-variant-numeric:tabular-nums}
  .stat .l{font-size:.7rem;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}

  /* ---------- Dossier grid ---------- */
  .grid{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
  @media(min-width:920px){.grid{grid-template-columns:1fr 1fr 1fr}}
  .tile{position:relative;text-align:left;cursor:pointer;border:1px solid var(--line);border-radius:18px;
    padding:20px;background:var(--glass);overflow:hidden;transition:.18s;display:flex;flex-direction:column;gap:8px}
  .tile:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:var(--glow)}
  .tile .ico{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;
    background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(91,140,255,.18));border:1px solid var(--line-2)}
  .tile .t{font-weight:800;font-size:1.05rem;letter-spacing:-.2px}
  .tile .d{color:var(--muted);font-size:.85rem;flex:1}
  .tile .meta{font-size:.72rem;color:var(--cyan);font-weight:800;letter-spacing:.4px;display:flex;align-items:center;gap:6px}
  .tile .arrow{position:absolute;top:20px;right:18px;color:var(--faint);font-size:1.1rem;transition:.18s}
  .tile:hover .arrow{color:var(--cyan);transform:translateX(3px)}

  /* quiz tiles (2-col) */
  .quiz-grid{display:grid;grid-template-columns:1fr;gap:13px}
  @media(min-width:640px){.quiz-grid{grid-template-columns:1fr 1fr}}
  .quiz-tile{position:relative;text-align:left;cursor:pointer;border:1px solid var(--line);border-radius:16px;
    padding:18px;background:var(--glass);transition:.16s;display:flex;flex-direction:column;gap:6px}
  .quiz-tile:hover{border-color:var(--line-2);box-shadow:var(--glow);transform:translateY(-2px)}
  .quiz-tile .t{font-weight:800;font-size:1rem;display:flex;align-items:center;gap:9px}
  .quiz-tile .d{color:var(--muted);font-size:.84rem}
  .quiz-tile .meta{margin-top:3px;font-size:.72rem;color:var(--cyan);font-weight:800;letter-spacing:.3px}
  .quiz-tile.exam{background:linear-gradient(135deg,rgba(251,191,36,.1),rgba(251,113,133,.06));border-color:rgba(251,191,36,.28)}
  .quiz-tile.exam:hover{box-shadow:0 0 0 1px rgba(251,191,36,.4),0 12px 40px rgba(251,191,36,.16)}
  .quiz-tile.exam .meta{color:var(--warn)}
  .quiz-tile.glob{background:linear-gradient(135deg,rgba(167,139,250,.14),rgba(34,211,238,.08));border-color:rgba(167,139,250,.32)}
  .quiz-tile.glob .meta{color:var(--violet)}

  .dossier-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .dossier-ico{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:1.6rem;flex:none;
    background:linear-gradient(135deg,var(--cyan),var(--blue));box-shadow:0 0 24px rgba(34,211,238,.4);color:#04121a}

  /* ---------- Mode choice ---------- */
  .mode-grid{display:grid;grid-template-columns:1fr;gap:15px;margin-top:6px}
  @media(min-width:760px){.mode-grid{grid-template-columns:1fr 1fr 1fr}}
  .mode-card.hard:hover{border-color:var(--violet);box-shadow:0 0 0 1px rgba(167,139,250,.4),0 12px 40px rgba(167,139,250,.18)}
  .mode-card{border:1px solid var(--line);border-radius:16px;padding:22px;cursor:pointer;transition:.16s;
    text-align:left;background:var(--glass);position:relative;overflow:hidden}
  .mode-card:hover{border-color:var(--cyan);box-shadow:var(--glow);transform:translateY(-2px)}
  .mode-card.exam:hover{border-color:var(--warn);box-shadow:0 0 0 1px rgba(251,191,36,.4),0 12px 40px rgba(251,191,36,.16)}
  .mode-card .ic{font-size:1.9rem;margin-bottom:6px}
  .mode-card h3{font-size:1.15rem;margin:6px 0;font-weight:800}
  .mode-card p{color:var(--muted);font-size:.86rem}

  /* ---------- Question ---------- */
  .progress-wrap{margin-bottom:18px}
  .progress-row{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);font-weight:700;margin-bottom:7px;letter-spacing:.3px}
  .progress{height:7px;background:rgba(120,170,255,.12);border-radius:999px;overflow:hidden}
  .progress > i{display:block;height:100%;border-radius:999px;transition:width .35s cubic-bezier(.4,0,.2,1);
    background:linear-gradient(90deg,var(--cyan),var(--blue));box-shadow:0 0 12px rgba(34,211,238,.6)}
  .qtype{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--cyan);margin-bottom:8px}
  .qtext{font-size:1.25rem;font-weight:700;margin-bottom:20px;line-height:1.4;letter-spacing:-.2px}
  .options{display:flex;flex-direction:column;gap:11px}
  .opt{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:13px;padding:15px;
    cursor:pointer;transition:.13s;background:var(--glass-2);font-size:.97rem;text-align:left;width:100%;color:var(--ink)}
  .opt:hover{border-color:var(--line-2);background:rgba(34,211,238,.06)}
  .opt .box{width:23px;height:23px;border:2px solid var(--faint);border-radius:7px;flex:none;display:grid;
    place-items:center;font-size:.78rem;color:#04121a;transition:.13s}
  .opt.radio .box{border-radius:50%}
  .opt.sel{border-color:var(--cyan);background:rgba(34,211,238,.12);box-shadow:inset 0 0 0 1px rgba(34,211,238,.3)}
  .opt.sel .box{background:var(--cyan);border-color:var(--cyan)}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt.correct .box{background:var(--ok);border-color:var(--ok)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.wrong .box{background:var(--bad);border-color:var(--bad)}
  .opt.disabled{cursor:default;pointer-events:none;opacity:.96}

  textarea{width:100%;border:1px solid var(--line-2);border-radius:13px;padding:15px;font:inherit;font-size:1rem;
    resize:vertical;min-height:96px;background:var(--glass-2);color:var(--ink)}
  textarea::placeholder{color:var(--faint)}
  textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.15)}

  .btn{border:none;border-radius:13px;padding:15px 18px;font-weight:800;font-size:1rem;cursor:pointer;transition:.13s;width:100%;font-family:inherit}
  .btn:active{transform:scale(.99)}
  .btn-primary{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#04121a;box-shadow:0 8px 26px rgba(34,211,238,.3)}
  .btn-primary:hover{box-shadow:0 10px 32px rgba(34,211,238,.45)}
  .btn-primary:disabled{background:rgba(120,170,255,.14);color:var(--faint);cursor:not-allowed;box-shadow:none}
  .btn-ghost{background:var(--glass-2);color:var(--ink);border:1px solid var(--line-2)}
  .btn-ghost:hover{border-color:var(--cyan);color:var(--cyan)}
  .btn-ok{background:linear-gradient(135deg,var(--ok),var(--teal));color:#04121a}
  .btn-bad{background:linear-gradient(135deg,var(--bad),#f43f5e);color:#fff}
  .row{display:flex;gap:11px;margin-top:18px}
  .row .btn{width:auto;flex:1}

  .feedback{margin-top:18px;border-radius:13px;padding:16px;border-left:4px solid;background:var(--glass-2)}
  .feedback.good{border-color:var(--ok);background:var(--ok-bg)}
  .feedback.bad{border-color:var(--bad);background:var(--bad-bg)}
  .feedback .fb-t{font-weight:800;margin-bottom:7px;display:flex;align-items:center;gap:8px}
  .feedback .exp{font-size:.92rem;color:var(--ink);opacity:.92}
  .answer-reveal{margin-top:16px;background:var(--glass-2);border:1px dashed var(--line-2);border-radius:13px;padding:16px}
  .answer-reveal .lab{font-size:.7rem;font-weight:800;text-transform:uppercase;color:var(--faint);letter-spacing:.6px}
  .answer-reveal .val{font-size:1.02rem;font-weight:700;color:var(--cyan);margin-top:5px}

  /* ---------- Results ---------- */
  .score-hero{text-align:center;padding:12px 0 6px}
  .score-ring{width:140px;height:140px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;
    background:conic-gradient(var(--ring-color,#34d399) calc(var(--pct,0)*1%), rgba(120,170,255,.12) 0);
    box-shadow:0 0 30px rgba(34,211,238,.2)}
  .score-ring > div{width:112px;height:112px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;flex-direction:column;border:1px solid var(--line)}
  .score-ring .big{font-size:1.8rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .score-ring .sub{font-size:.7rem;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
  .verdict{font-size:1.2rem;font-weight:800;margin-bottom:4px}
  .rev-item{border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:11px;background:var(--glass-2)}
  .rev-item .q{font-weight:700;margin-bottom:9px;display:flex;gap:9px}
  .rev-item .q .ic{flex:none}
  .rev-line{font-size:.9rem;margin:4px 0;color:var(--muted)}
  .rev-line .k{color:var(--faint);font-weight:700}
  .tag-ok{color:var(--ok);font-weight:600} .tag-bad{color:var(--bad);font-weight:600}
  .selfrate{display:flex;gap:9px;margin-top:9px}
  .selfrate .btn{padding:10px;font-size:.85rem}
  /* ---------- Classement & profil ---------- */
  .profile-row,.pub-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .profile-row input,.pub-row input,.lb-controls select{background:var(--glass-2);border:1px solid var(--line-2);
    color:var(--ink);border-radius:11px;padding:11px 13px;font:inherit;font-size:.95rem}
  .profile-row input{flex:1;min-width:150px}
  .profile-row input:focus,.pub-row input:focus,.lb-controls select:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
  .lb-controls{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
  .lb-controls label{display:flex;flex-direction:column;gap:6px;font-size:.7rem;color:var(--faint);font-weight:800;text-transform:uppercase;letter-spacing:.5px}
  .lb-controls select{cursor:pointer}
  .lb-table{display:flex;flex-direction:column;gap:7px;margin-top:10px}
  .lb-row{display:grid;grid-template-columns:40px 1fr 74px 52px 96px;align-items:center;gap:8px;padding:12px 13px;
    border:1px solid var(--line);border-radius:12px;background:var(--glass-2);font-size:.92rem}
  .lb-row span:nth-child(1){font-weight:800;color:var(--cyan)}
  .lb-row span:nth-child(2){font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb-row span small{display:block;color:var(--faint);font-weight:500;font-size:.72rem;white-space:nowrap}
  .lb-row.lb-head{background:transparent;border-color:transparent;color:var(--faint);font-size:.66rem;
    text-transform:uppercase;letter-spacing:.5px;font-weight:800;padding:2px 13px}
  .lb-row.lb-head span:nth-child(1){color:var(--faint)}
  .lb-row.lb-me{border-color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(34,211,238,.4)}
  code{background:rgba(120,170,255,.12);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:.86em}
  .hidden{display:none!important}
  footer{text-align:center;color:var(--faint);font-size:.74rem;padding:18px;position:relative;z-index:1}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <span class="logo">+</span>
      <div>Révisions IFSI · UE 2.7<small id="brand-sub">Défaillances organiques</small></div>
    </div>
    <div class="timer" id="timer">⏱ <span id="timer-val">10:00</span></div>
    <button class="btn-home" id="btn-home">↩ Menu principal</button>
  </div>
</header>

<div class="app" id="app"></div>
<footer>UE 2.7 · Défaillances organiques et processus dégénératifs · Application de révision IFSI</footer>

<!-- SDK Supabase (classement en ligne) — chargé depuis un CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   DONNÉES — UE 2.7
   Types : qcm (choix), vf (vrai/faux), libre (texte + auto-éval)
   ============================================================ */
const M = (t,c)=>({t:t,c:!!c}); // option helper

const DATA = { dossiers: [
/* ====================== DIABÈTE ====================== */
{
  id:"diabete", nom:"Diabète", ico:"🩸",
  desc:"Anatomie pancréatique, DT1/DT2, traitements et complications.",
  long:"Anatomie et physiologie du pancréas, régulation glycémique, diabète de type 1 et 2, antidiabétiques et insulinothérapie, complications aiguës et chroniques, grossesse.",
  quizzes:[
    {
      id:"physio", nom:"Anatomie & régulation glycémique",
      desc:"Pancréas, insuline, glucagon, régulation de la glycémie",
      questions:[
        {type:"qcm", q:"Où est situé le pancréas ?", o:[
          M("Organe rétropéritonéal, en arrière de l'estomac, en regard de L1-L2",1),
          M("Organe intra-thoracique, derrière le cœur"),
          M("Dans le pelvis, sous la vessie"),
          M("En avant de l'estomac, sous le diaphragme")],
          exp:"Le pancréas est un organe rétropéritonéal situé en arrière de l'estomac, en regard de L1-L2."},
        {type:"qcm", q:"Quelles sont les 4 parties du pancréas ?", o:[
          M("Tête, col, corps, queue",1),
          M("Tête, isthme, anse, base"),
          M("Lobe droit, lobe gauche, hile, capsule"),
          M("Cortex, médullaire, hile, pôle")],
          exp:"Le pancréas comprend 4 parties : la tête (encadrée par le duodénum), le col, le corps et la queue (en rapport avec la rate)."},
        {type:"vf", q:"La queue du pancréas est en rapport avec la rate.", a:true,
          exp:"Vrai. La queue du pancréas est en rapport avec la rate ; la tête est encadrée par le duodénum."},
        {type:"qcm", q:"La fonction EXOCRINE du pancréas correspond à :", o:[
          M("La sécrétion d'enzymes par les acini, transportées par le canal pancréatique vers le tube digestif",1),
          M("La sécrétion d'hormones dans le sang"),
          M("La régulation de la glycémie"),
          M("La production d'insuline par les îlots de Langerhans")],
          exp:"Fonction exocrine = sécrétion d'enzymes digestives par les acini. Fonction endocrine = sécrétion d'hormones dans le sang."},
        {type:"qcm", q:"Quelle structure produit les hormones régulant la glycémie ?", o:[
          M("Les îlots de Langerhans",1),
          M("Les acini pancréatiques"),
          M("Le canal de Wirsung"),
          M("Le duodénum")],
          exp:"Les hormones (insuline, glucagon...) sont produites par les îlots de Langerhans (fonction endocrine)."},
        {type:"qcm", q:"Quelle cellule sécrète l'INSULINE ?", o:[
          M("La cellule bêta",1), M("La cellule alpha"), M("La cellule delta"), M("La cellule PP")],
          exp:"Cellule β → insuline (hypoglycémiante) · α → glucagon · δ → somatostatine · PP → polypeptide pancréatique."},
        {type:"qcm", q:"Quelle cellule sécrète le GLUCAGON ?", o:[
          M("La cellule alpha",1), M("La cellule bêta"), M("La cellule delta"), M("La cellule PP")],
          exp:"La cellule α sécrète le glucagon, hormone hyperglycémiante."},
        {type:"vf", q:"L'insuline est la seule hormone hypoglycémiante de l'organisme.", a:true,
          exp:"Vrai. L'insuline est la SEULE hormone hypoglycémiante de l'organisme."},
        {type:"qcm", q:"Quel est l'effet de la somatostatine (cellule δ) ?", o:[
          M("Elle inhibe l'insuline ET le glucagon",1),
          M("Elle stimule uniquement l'insuline"),
          M("Elle est hyperglycémiante"),
          M("Elle régule l'absorption du calcium")],
          exp:"La somatostatine inhibe à la fois l'insuline et le glucagon."},
        {type:"libre", q:"Citez les 3 tissus insulino-sensibles dans lesquels l'insuline fait entrer le glucose.",

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function poolFromDossier(d){ let all=[]; d.quizzes.forEach(q=>{ all=all.concat(q.questions); }); return all; }
function poolGlobal(){ let all=[]; DATA.dossiers.forEach(d=>{ all=all.concat(poolFromDossier(d)); }); return all; }

function buildQuestions(quiz){
  let pool;
  if(quiz.exam){
    const src = quiz.scope==='global' ? poolGlobal() : poolFromDossier(quiz.dossier);
    pool = shuffle(src).slice(0, quiz.count||40);
  } else {
    pool = shuffle(quiz.questions);
  }
  return pool.map(q=>{ const nq=Object.assign({},q); if(q.type==='qcm') nq.o=shuffle(q.o); return nq; });
}

const VALID_MODES = ['examen','difficile','entrainement'];
/* Validation côté client (anti-saisie aberrante). La base applique les mêmes règles via CHECK. */
function validateRec(rec){
  if(!rec.pseudo || rec.pseudo.length<1 || rec.pseudo.length>24) return 'Pseudo invalide (1 à 24 caractères).';
  if(rec.promo && rec.promo.length>24) return 'Promo trop longue (24 caractères max).';
  if(VALID_MODES.indexOf(rec.mode)<0) return 'Mode invalide.';
  if(!Number.isInteger(rec.total) || rec.total<1 || rec.total>40) return 'Nombre de questions invalide.';
  if(!Number.isInteger(rec.score) || rec.score<0 || rec.score>rec.total) return 'Score invalide.';
  if(!Number.isInteger(rec.pct) || rec.pct<0 || rec.pct>100) return 'Pourcentage invalide.';
  return null;
}
async function submitScore(rec){
  if(!sbReady()) throw new Error('Classement non configuré');
  const err=validateRec(rec); if(err) throw new Error(err);
  const { error } = await _sb.from('scores').insert(rec);
  if(error) throw error;
}
async function fetchScores(quizFilter, modeFilter, promoFilter){
  if(!sbReady()) throw new Error('Classement non configuré');
  let q = _sb.from('scores').select('pseudo,promo,quiz,mode,score,total,pct,created_at')
            .order('pct',{ascending:false}).order('score',{ascending:false})
            .order('created_at',{ascending:true}).limit(100);
  if(quizFilter && quizFilter!=='__all__') q = q.eq('quiz', quizFilter);
  if(modeFilter && modeFilter!=='__all__') q = q.eq('mode', modeFilter);
  if(promoFilter) q = q.eq('promo', promoFilter);
  const { data, error } = await q;
  if(error) throw error;
  return data||[];
}

async function loadLeaderboard(quizFilter, modeFilter, promoFilter){
  const box=document.getElementById('lb-result'); if(!box) return;
  box.innerHTML='<p class="lead">Chargement…</p>';
  try{
    const rows=await fetchScores(quizFilter, modeFilter, promoFilter);
    if(!rows.length){ box.innerHTML='<h2>Top scores</h2><p class="lead">Aucun score publié pour ces critères. Sois le premier à publier le tien ! 🚀</p>'; return; }
    const me=getPseudo();

    rows.forEach((r,i)=>{

      const rank = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
      const promo = r.promo ? `<small>${escapeHtml(r.promo)}</small>` : '';
      html+=`<div class="lb-row${mine}"><span>${rank}</span><span>${escapeHtml(r.pseudo)}${promo}</span><span>${r.score}/${r.total}</span><span>${r.pct}%</span><span>${MODE_LABEL2[r.mode]||r.mode}</span></div>`;
    });
    html+='</div>';
    box.innerHTML=html;
  }catch(e){
    box.innerHTML='<h2>Top scores</h2><p class="lead">Impossible de charger le classement. Vérifie ta connexion internet ou la configuration Supabase.</p>';
  }
}

    if(!v){ msg.textContent='⚠️ Saisis un pseudo.'; return; }
    setPseudo(v); setPromo(pr);
    msg.textContent='✅ Enregistré : '+v+(pr?(' · promo '+pr):'');
  });
}

/* -------------------- ÉCRAN : DOSSIER -------------------- */
function renderDossier(di){
  const d = DATA.dossiers[di];
  navContext={type:'dossier', di};
  btnHome.style.display='flex'; timerEl.style.display='none';
  brandSub.textContent=d.nom; window.scrollTo(0,0);

  let tiles='';
  d.quizzes.forEach((q,qi)=>{
    tiles += `
      <button class="quiz-tile" data-quiz="${qi}">
        <div class="t">📘 ${q.nom}</div>
        <div class="d">${q.desc}</div>
        <div class="meta">${q.questions.length} questions</div>
      </button>`;
  });
  // examen blanc du dossier
  tiles += `
    <button class="quiz-tile exam" data-exam="1">
      <div class="t">🏆 Examen blanc — ${d.nom}</div>
      <div class="d">Questions tirées au sort sur tout le dossier · conditions d'examen.</div>
      <div class="meta">${Math.min(40, poolFromDossier(d).length)} questions · minuté 10 min</div>
    </button>`;

  app.innerHTML = `
    <div class="card">
      <button class="btn-home" style="display:inline-flex;margin-bottom:16px" id="back-home">↩ Tous les dossiers</button>
      <div class="dossier-head">
        <div class="dossier-ico">${d.ico}</div>
        <div>
          <span class="pill" style="margin-bottom:6px">Dossier</span>
          <h1 style="font-size:1.45rem;margin:0">${d.nom}</h1>
        </div>
      </div>
      <p class="lead">${d.long||d.desc}</p>
    </div>
    <div class="card">
      <h2>Quiz du dossier</h2>
      <p class="lead" style="margin-bottom:18px">Choisis un sous-thème ou tente l'examen blanc du dossier.</p>
      <div class="quiz-grid">${tiles}</div>
    </div>`;

  document.getElementById('back-home').addEventListener('click', renderHome);
  document.querySelectorAll('[data-quiz]').forEach(b=>{
    b.addEventListener('click', ()=> renderModeChoice(d.quizzes[+b.dataset.quiz]));
  });
  const examBtn=document.querySelector('[data-exam]');
  if(examBtn) examBtn.addEventListener('click', ()=>{
    const quiz={ nom:'Examen blanc — '+d.nom, desc:'Questions tirées au sort sur tout le dossier '+d.nom+'.', exam:true, scope:'dossier', dossier:d, count:40 };
    renderModeChoice(quiz);
  });
}

/* -------------------- ÉCRAN : CHOIX DU MODE -------------------- */
function renderModeChoice(quiz){
  btnHome.style.display='flex'; window.scrollTo(0,0);
  app.innerHTML = `
    <div class="card">
      <span class="pill">${quiz.exam?'🏆 Examen blanc':'📘 Quiz thématique'}</span>
      <h1>${quiz.nom}</h1>
      <p class="lead">${quiz.desc}</p>
    </div>
    <div class="card">
      <h2>Choisis ton mode</h2>
      <div class="mode-grid">
        <div class="mode-card" data-mode="entrainement">
          <div class="ic">🎓</div>
          <h3>Entraînement</h3>
          <p>Correction immédiate après chaque réponse, avec l'explication pédagogique. Pas de chrono. Idéal pour apprendre.</p>
        </div>
        <div class="mode-card exam" data-mode="examen">
          <div class="ic">⏱️</div>
          <h3>Examen</h3>
          <p>Chrono de 10 minutes, aucune correction pendant l'épreuve. Score et corrigé complet à la fin. Conditions réelles.</p>
        </div>
        <div class="mode-card hard" data-mode="difficile">
          <div class="ic">🧠</div>
          <h3>Difficile</h3>
          <p>Les mêmes questions, mais TOUT en réponse libre : aucun choix proposé, tu dois tout retrouver de mémoire puis t'auto-évaluer.</p>
        </div>
      </div>
      ${quiz.exam?'<p class="lead" style="margin-top:14px;font-size:.82rem">💡 L\'examen blanc est conçu pour le mode Examen, mais tu peux aussi t\'entraîner.</p>':''}
    </div>`;
  document.querySelectorAll('[data-mode]').forEach(c=>{
    c.addEventListener('click', ()=> startQuiz(quiz, c.dataset.mode));
  });
}

/* -------------------- DÉMARRAGE -------------------- */
/* Convertit n'importe quelle question en réponse libre (mode Difficile) */
function toLibre(q){
  if(q.type==='libre') return Object.assign({}, q);
  let a;
  if(q.type==='qcm'){ a = q.o.filter(o=>o.c).map(o=>o.t).join(' ; '); }
  else { a = q.a ? 'Vrai' : 'Faux'; }
  return { type:'libre', q:q.q, a:a, exp:q.exp };
}
const MODE_LABEL = { examen:'Examen', entrainement:'Entraînement', difficile:'Difficile' };
function startQuiz(quiz, mode){
  let questions = buildQuestions(quiz);
  if(mode==='difficile'){ questions = questions.map(toLibre); }
  state = { quiz, mode, questions, idx:0, answers:[], revealed:false, finished:false };
  brandSub.textContent = quiz.nom + ' · ' + (MODE_LABEL[mode]||'Entraînement');
  btnHome.style.display='flex';
  if(mode==='examen'){ startTimer(10*60); } else { timerEl.style.display='none'; }
  renderQuestion();
}

/* -------------------- TIMER -------------------- */
let timerInt=null;
function startTimer(seconds){
  stopTimer(); let remaining=seconds; timerEl.style.display='flex'; updateTimerDisplay(remaining);
  timerInt=setInterval(()=>{ remaining--; updateTimerDisplay(remaining); if(remaining<=0){ stopTimer(); finishQuiz(true); } },1000);
}
function updateTimerDisplay(s){ const m=Math.floor(s/60),sec=s%60; timerVal.textContent=m+':'+String(sec).padStart(2,'0'); timerEl.classList.toggle('calm', s>60); }
function stopTimer(){ if(timerInt){ clearInterval(timerInt); timerInt=null; } }

/* -------------------- ÉCRAN : QUESTION -------------------- */
function renderQuestion(){
  window.scrollTo(0,0);
  const s=state, q=s.questions[s.idx], total=s.questions.length;
  const pct=Math.round((s.idx)/total*100); s.revealed=false;
  const typeLabel={qcm:'Question à choix', vf:'Vrai ou Faux', libre:'Réponse libre'}[q.type];

  let body='';
  if(q.type==='qcm'){
    const multi=q.o.filter(o=>o.c).length>1;
    body=`${multi?'<p class="lead" style="font-size:.82rem;margin-bottom:10px">Plusieurs réponses possibles.</p>':''}
      <div class="options" id="opts">
        ${q.o.map((o,i)=>`<button class="opt ${multi?'check':'radio'}" data-i="${i}"><span class="box"></span><span>${o.t}</span></button>`).join('')}
      </div>`;
  } else if(q.type==='vf'){
    body=`<div class="options" id="opts">
        <button class="opt radio" data-v="true"><span class="box"></span><span>✅ Vrai</span></button>
        <button class="opt radio" data-v="false"><span class="box"></span><span>❌ Faux</span></button>
      </div>`;
  } else {
    body=`<textarea id="freetext" placeholder="Tape ta réponse ici, puis valide…"></textarea>`;
  }

  app.innerHTML=`
    <div class="card">
      <div class="progress-wrap">
        <div class="progress-row"><span>Question ${s.idx+1} / ${total}</span><span>${s.mode==='examen'?'⏱ Mode Examen':s.mode==='difficile'?'🧠 Mode Difficile':'🎓 Mode Entraînement'}</span></div>
        <div class="progress"><i style="width:${pct}%"></i></div>
      </div>
      <div class="qtype">${typeLabel}</div>
      <div class="qtext">${q.q}</div>
      ${body}
      <div id="feedback-zone"></div>
      <div id="action-zone"></div>
    </div>`;

  let selected = q.type==='qcm'?[]:null;

  if(q.type==='qcm'){
    const multi=q.o.filter(o=>o.c).length>1;
    document.querySelectorAll('#opts .opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(s.revealed) return;
        const i=+btn.dataset.i;
        if(multi){ const pos=selected.indexOf(i); if(pos>=0){ selected.splice(pos,1); btn.classList.remove('sel'); } else { selected.push(i); btn.classList.add('sel'); } }
        else { selected=[i]; document.querySelectorAll('#opts .opt').forEach(b=>b.classList.remove('sel')); btn.classList.add('sel'); }
        refreshValidate();
      });
    });
  } else if(q.type==='vf'){
    document.querySelectorAll('#opts .opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(s.revealed) return;
        selected=btn.dataset.v==='true';
        document.querySelectorAll('#opts .opt').forEach(b=>b.classList.remove('sel')); btn.classList.add('sel');
        refreshValidate();
      });
    });
  } else {
    document.getElementById('freetext').addEventListener('input', refreshValidate);
  }

  const actionZone=document.getElementById('action-zone');
  function refreshValidate(){
    const v=document.getElementById('validate-btn'); if(!v) return;
    let ok=false;
    if(q.type==='qcm') ok=selected.length>0;
    else if(q.type==='vf') ok=selected!==null;
    else ok=document.getElementById('freetext').value.trim().length>0;
    v.disabled=!ok;
  }
  function drawAction(){
    if(s.mode==='examen'){
      actionZone.innerHTML=`<button class="btn btn-primary" id="validate-btn" disabled>${s.idx===total-1?'Terminer l\'examen':'Valider et continuer'}</button>`;
      document.getElementById('validate-btn').addEventListener('click', submitExam);
    } else {
      actionZone.innerHTML=`<button class="btn btn-primary" id="validate-btn" disabled>Valider ma réponse</button>`;
      document.getElementById('validate-btn').addEventListener('click', validateTraining);
    }
    refreshValidate();
  }
  drawAction();

  function submitExam(){
    let entry;
    if(q.type==='qcm'){
      const correctIdx=q.o.map((o,i)=>o.c?i:-1).filter(i=>i>=0);
      entry={type:'qcm', selected:selected.slice(), correct:arraysEqual(selected.slice().sort(),correctIdx.slice().sort())};
    } else if(q.type==='vf'){ entry={type:'vf', value:selected, correct:(selected===q.a)}; }
    else { entry={type:'libre', text:document.getElementById('freetext').value.trim(), correct:null}; }
    entry.q=q; s.answers[s.idx]=entry; nextOrFinish();
  }

  function validateTraining(){
    s.revealed=true; const fb=document.getElementById('feedback-zone');
    if(q.type==='qcm'){
      const correctIdx=q.o.map((o,i)=>o.c?i:-1).filter(i=>i>=0);
      const correct=arraysEqual(selected.slice().sort(),correctIdx.slice().sort());
      document.querySelectorAll('#opts .opt').forEach(btn=>{
        const i=+btn.dataset.i; btn.classList.add('disabled'); btn.classList.remove('sel');
        if(q.o[i].c) btn.classList.add('correct'); else if(selected.includes(i)) btn.classList.add('wrong');
      });
      s.answers[s.idx]={type:'qcm', selected:selected.slice(), correct, q}; showFeedback(fb, correct, q.exp); drawNext();
    } else if(q.type==='vf'){
      const correct=(selected===q.a);
      document.querySelectorAll('#opts .opt').forEach(btn=>{
        btn.classList.add('disabled'); btn.classList.remove('sel'); const v=btn.dataset.v==='true';
        if(v===q.a) btn.classList.add('correct'); else if(v===selected) btn.classList.add('wrong');
      });
      s.answers[s.idx]={type:'vf', value:selected, correct, q}; showFeedback(fb, correct, q.exp); drawNext();
    } else {
      const txt=document.getElementById('freetext').value.trim();
      document.getElementById('freetext').setAttribute('disabled','');
      fb.innerHTML=`
        <div class="answer-reveal"><div class="lab">Réponse attendue</div><div class="val">${q.a}</div></div>
        ${q.exp?`<div class="feedback good" style="margin-top:12px"><div class="exp">💡 ${q.exp}</div></div>`:''}
        <p class="lead" style="margin-top:14px;font-weight:700;color:var(--ink)">Compare avec ta réponse — t'étais-tu trompé(e) ?</p>
        <div class="row">
          <button class="btn btn-ok" id="self-ok">✅ J'avais juste</button>
          <button class="btn btn-bad" id="self-bad">❌ J'avais faux</button>
        </div>`;
      actionZone.innerHTML='';
      document.getElementById('self-ok').addEventListener('click', ()=>{ s.answers[s.idx]={type:'libre', text:txt, correct:true, q}; nextOrFinish(); });
      document.getElementById('self-bad').addEventListener('click', ()=>{ s.answers[s.idx]={type:'libre', text:txt, correct:false, q}; nextOrFinish(); });
    }
  }
  function drawNext(){
    actionZone.innerHTML=`<button class="btn btn-primary" id="next-btn">${s.idx===total-1?'Voir mon résultat':'Question suivante →'}</button>`;
    document.getElementById('next-btn').addEventListener('click', nextOrFinish);
  }
}

function showFeedback(el, correct, exp){
  el.innerHTML=`<div class="feedback ${correct?'good':'bad'}"><div class="fb-t">${correct?'✅ Bonne réponse !':'❌ Réponse incorrecte'}</div>${exp?`<div class="exp">💡 ${exp}</div>`:''}</div>`;
}
function arraysEqual(a,b){ if(a.length!==b.length) return false; for(let i=0;i<a.length;i++) if(a[i]!==b[i]) return false; return true; }
function nextOrFinish(){ if(state.idx<state.questions.length-1){ state.idx++; renderQuestion(); } else { finishQuiz(false); } }

/* -------------------- RÉSULTATS -------------------- */
function finishQuiz(byTimeout){ state.finished=true; stopTimer(); timerEl.style.display='none'; window.scrollTo(0,0); renderResults(byTimeout); }
function computeScore(){ let score=0,gradable=0; state.answers.forEach(a=>{ if(!a) return; if(a.correct===true) score++; if(a.correct!==null) gradable++; }); return {score,gradable}; }

function renderResults(byTimeout){
  const s=state, total=s.questions.length;
  for(let i=0;i<total;i++){ if(!s.answers[i]){ const q=s.questions[i]; s.answers[i]={type:q.type, q, correct:false, selected:[], value:null, text:'', noAnswer:true}; } }
  const {score,gradable}=computeScore();
  const pct=gradable?Math.round(score/gradable*100):0;
  const ringColor=pct>=75?'#34d399':pct>=50?'#fbbf24':'#fb7185';
  const verdict=pct>=75?'Excellent ! 🎉':pct>=50?'Bien, continue ! 💪':'À retravailler 📚';

  let review='';
  s.answers.forEach((a,i)=>{
    const q=a.q, num=i+1; let userLine='',expLine=''; const isLibre=q.type==='libre';
    if(q.type==='qcm'){
      const userTxt=a.selected&&a.selected.length?a.selected.map(idx=>q.o[idx].t).join(' · '):'— (pas de réponse)';
      const goodTxt=q.o.filter(o=>o.c).map(o=>o.t).join(' · ');
      userLine=`<div class="rev-line"><span class="k">Ta réponse :</span> <span class="${a.correct?'tag-ok':'tag-bad'}">${userTxt}</span></div>`;
      expLine=`<div class="rev-line"><span class="k">Réponse(s) correcte(s) :</span> <span class="tag-ok">${goodTxt}</span></div>`;
    } else if(q.type==='vf'){
      const userTxt=a.value===null||a.value===undefined?'— (pas de réponse)':(a.value?'Vrai':'Faux');
      userLine=`<div class="rev-line"><span class="k">Ta réponse :</span> <span class="${a.correct?'tag-ok':'tag-bad'}">${userTxt}</span></div>`;
      expLine=`<div class="rev-line"><span class="k">Bonne réponse :</span> <span class="tag-ok">${q.a?'Vrai':'Faux'}</span></div>`;
    } else {
      const userTxt=a.text?a.text:'— (pas de réponse)';
      userLine=`<div class="rev-line"><span class="k">Ta réponse :</span> ${userTxt}</div>`;
      expLine=`<div class="rev-line"><span class="k">Réponse attendue :</span> <span class="tag-ok">${q.a}</span></div>`;
    }
    const statusIco=a.correct===true?'✅':a.correct===false?'❌':'📝';
    let selfRate='';
    if(isLibre&&a.correct===null){
      selfRate=`<div class="selfrate" data-i="${i}"><button class="btn btn-ok" data-rate="ok">✅ J'avais juste</button><button class="btn btn-bad" data-rate="bad">❌ J'avais faux</button></div>`;
    }
    review+=`<div class="rev-item" data-rev="${i}">
        <div class="q"><span class="ic">${statusIco}</span><span>Q${num}. ${q.q}</span></div>
        ${userLine}${expLine}
        ${q.exp?`<div class="rev-line" style="margin-top:6px"><span class="k">💡</span> ${q.exp}</div>`:''}
        ${selfRate}
      </div>`;
  });

  app.innerHTML=`
    <div class="card">
      ${byTimeout?'<span class="pill" style="background:rgba(251,113,133,.12);color:var(--bad);border-color:rgba(251,113,133,.3)">⏱ Temps écoulé</span>':''}
      <div class="score-hero">
        <div class="score-ring" id="ring" style="--pct:${pct};--ring-color:${ringColor}">
          <div><span class="big" id="score-big">${score}/${gradable}</span><span class="sub">bonnes réponses</span></div>
        </div>
        <div class="verdict" id="verdict">${verdict}</div>
        <p class="lead" id="pct-line">Score : ${pct}% &nbsp;·&nbsp; ${s.quiz.nom}</p>
      </div>
      <div class="row">
        <button class="btn btn-ghost" id="retry">↻ Recommencer</button>
        <button class="btn btn-primary" id="to-home">Menu principal</button>
      </div>
      <div id="publish-zone" style="margin-top:14px"></div>
    </div>
    <div class="card">
      <h2>📋 Corrigé détaillé</h2>
      <p class="lead" style="margin-bottom:14px">Compare tes réponses aux réponses attendues.</p>
      ${review}
    </div>
    <div class="card">
      <div class="row">
        <button class="btn btn-ghost" id="retry2">↻ Recommencer</button>
        <button class="btn btn-primary" id="to-home2">Menu principal</button>
      </div>
    </div>`;

  document.getElementById('retry').addEventListener('click', ()=> startQuiz(s.quiz, s.mode));
  document.getElementById('retry2').addEventListener('click', ()=> startQuiz(s.quiz, s.mode));
  document.getElementById('to-home').addEventListener('click', goBack);
  document.getElementById('to-home2').addEventListener('click', goBack);

  /* ---- Publication du score au classement ---- */
  const pubZone=document.getElementById('publish-zone');
  function drawPublish(){
    if(!pubZone) return;
    if(!sbReady()){ pubZone.innerHTML='<p class="lead" style="font-size:.8rem">🏆 Classement en ligne non activé.</p>'; return; }
    const pseudo=getPseudo();
    pubZone.innerHTML = pseudo
      ? `<button class="btn btn-primary" id="pub-go" style="width:auto">📤 Publier mon score (${escapeHtml(pseudo)})</button>`
      : `<div class="pub-row"><input id="pub-pseudo" placeholder="Ton pseudo" maxlength="24"><button class="btn btn-primary" id="pub-go" style="width:auto">📤 Publier</button></div>`;
    const go=document.getElementById('pub-go');
    if(go) go.addEventListener('click', async ()=>{
      let pseudo=getPseudo();
      const inp=document.getElementById('pub-pseudo');
      if(inp){ pseudo=inp.value.trim(); if(!pseudo){ inp.focus(); return; } setPseudo(pseudo); }
      go.disabled=true; go.textContent='Publication…';
      const r=computeScore(); const p=r.gradable?Math.round(r.score/r.gradable*100):0;
      try{
        await submitScore({ pseudo, promo:getPromo(), quiz:s.quiz.nom, mode:s.mode, score:r.score, total:r.gradable, pct:p });
        pubZone.innerHTML=`<p class="lead" style="color:var(--ok);font-weight:700">✅ Score publié au classement !</p><button class="btn btn-ghost" id="pub-see" style="width:auto;margin-top:8px">🏆 Voir le classement</button>`;
        document.getElementById('pub-see').addEventListener('click', renderLeaderboard);
      }catch(e){
        go.disabled=false; go.textContent='📤 Réessayer';
        if(!document.getElementById('pub-err')) pubZone.insertAdjacentHTML('beforeend','<p class="lead" id="pub-err" style="color:var(--bad);font-size:.8rem;margin-top:8px">Échec de la publication. Vérifie ta connexion.</p>');
      }
    });
  }
  drawPublish();

  document.querySelectorAll('.selfrate').forEach(div=>{
    const i=+div.dataset.i;
    div.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{
        const good=b.dataset.rate==='ok'; s.answers[i].correct=good;
        const item=document.querySelector(`[data-rev="${i}"] .ic`); if(item) item.textContent=good?'✅':'❌';
        div.innerHTML=`<p class="lead" style="font-weight:700;color:${good?'var(--ok)':'var(--bad)'}">${good?'✅ Comptée juste':'❌ Comptée fausse'}</p>`;
        const r=computeScore(); const p=r.gradable?Math.round(r.score/r.gradable*100):0;
        const col=p>=75?'#34d399':p>=50?'#fbbf24':'#fb7185';
        document.getElementById('score-big').textContent=r.score+'/'+r.gradable;
        document.getElementById('ring').style.setProperty('--pct',p);
        document.getElementById('ring').style.setProperty('--ring-color',col);
        document.getElementById('pct-line').innerHTML=`Score : ${p}% &nbsp;·&nbsp; ${s.quiz.nom}`;
        document.getElementById('verdict').textContent=p>=75?'Excellent ! 🎉':p>=50?'Bien, continue ! 💪':'À retravailler 📚';
      });
    });
  });
}

/* -------------------- NAVIGATION -------------------- */
function goBack(){
  if(navContext && navContext.type==='dossier') renderDossier(navContext.di);
  else renderHome();
}
btnHome.addEventListener('click', ()=>{
  if(state && !state.finished){ if(!confirm('Quitter le quiz en cours ? Ta progression sera perdue.')) return; }
  renderHome();
});

renderHome();
</script>
</body>
</html>
